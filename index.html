<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fail Peribadi Murid</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Untuk compile JSX dalam browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* CSS Tambahan untuk memastikan background sentiasa penuh */
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Modul Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyD3GRV6VIpECWq48M2jWq_QEQ9RUEbHBBw",
            authDomain: "fail-peribadi-murid.firebaseapp.com",
            projectId: "fail-peribadi-murid",
            storageBucket: "fail-peribadi-murid.firebasestorage.app",
            messagingSenderId: "804840511723",
            appId: "1:804840511723:web:1cbc82e294c55cea21c6ae",
            measurementId: "G-ZRKX0NXHZJ"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Menjadikan Firebase boleh diakses oleh React
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.signInAnonymously = signInAnonymously;
        window.onAuthStateChanged = onAuthStateChanged;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
    </script>

    <!-- Skrip Aplikasi React -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [icNumber, setIcNumber] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(true);

            // Senarai IC yang dikekalkan secara kekal (Admin/Guru)
            const [authorizedIcs, setAuthorizedIcs] = useState([
                '810808135501', 
                '910110136471', 
                '880927135284', 
                '920422135813', 
                '970226135344',
                'admin123'
            ]);

            useEffect(() => {
                // 1. Dapatkan senarai IC murid secara dinamik dari Google Sheets (CSV)
                const fetchCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT-vlBOQG_pelA8C9Nfb51agzdS_JyCBV0VJCfFWy-dZV7dvZp1AwQgkGGuSLxoViVHvzmjH0SfBbLD/pub?output=csv";
                
                fetch(fetchCsvUrl)
                    .then(response => response.text())
                    .then(csvText => {
                        // Buang simbol "-" jika wujud dan cari corak 12-digit nombor dalam fail CSV
                        const textTanpaSengkang = csvText.replace(/-/g, '');
                        const icDariCsv = textTanpaSengkang.match(/\b\d{12}\b/g) || [];
                        
                        // Gabungkan IC sedia ada dengan IC dari Google Sheets (tanpa pertindihan/duplicate)
                        setAuthorizedIcs(prevIcs => {
                            const gabungan = [...prevIcs, ...icDariCsv];
                            return [...new Set(gabungan)];
                        });
                    })
                    .catch(err => console.error("Ralat memuat turun senarai IC Google Sheets:", err));

                // 2. Tunggu Firebase dimuatkan
                const checkFirebase = setInterval(() => {
                    if (window.firebaseAuth) {
                        clearInterval(checkFirebase);
                        
                        // Log masuk secara anonymous (background)
                        window.signInAnonymously(window.firebaseAuth)
                            .then(() => {
                                window.onAuthStateChanged(window.firebaseAuth, (user) => {
                                    if (user) {
                                        setLoading(false);
                                    }
                                });
                            })
                            .catch((error) => {
                                console.error("Ralat Pengesahan Firebase:", error);
                                setLoading(false);
                            });
                    }
                }, 100);

                return () => clearInterval(checkFirebase);
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                
                // Semak samada nombor dimasukkan bersih dari sempang '-'
                const cleanInput = icNumber.replace(/-/g, '');

                if (authorizedIcs.includes(cleanInput)) {
                    setIsAuthenticated(true);
                    setError('');
                } else {
                    setError('Nombor Kad Pengenalan tidak sah atau tiada dalam rekod.');
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100">
                        <div className="text-xl font-semibold text-gray-600">Memuatkan Sistem...</div>
                    </div>
                );
            }

            // --- SKRIN LOG MASUK ---
            if (!isAuthenticated) {
                return (
                    <div 
                        className="min-h-screen flex items-center justify-center px-4" 
                        style={{ 
                            backgroundImage: "url('sekolah.png')", 
                            backgroundSize: 'cover', 
                            backgroundPosition: 'center', 
                            backgroundAttachment: 'fixed',
                            backgroundColor: 'rgba(255, 255, 255, 0.7)', 
                            backgroundBlendMode: 'overlay' 
                        }}
                    >
                        <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-100">
                            <div className="text-center mb-8">
                                
                                <div className="flex justify-center mb-4">
                                    <img 
                                        src="logo.png" 
                                        alt="Logo Sekolah" 
                                        className="w-24 h-24 rounded-full object-cover border-4 border-blue-500 shadow-lg bg-gray-50"
                                        onError={(e) => {
                                            e.target.onerror = null; 
                                            e.target.src = "https://via.placeholder.com/150?text=Logo";
                                        }}
                                    />
                                </div>
                                
                                <h1 className="text-2xl font-bold text-gray-800">Fail Peribadi Murid</h1>
                                <p className="text-gray-500 mt-2">Sila log masuk untuk mengakses rekod</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Nombor Kad Pengenalan
                                    </label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i className="fas fa-id-card text-gray-400"></i>
                                        </div>
                                        <input
                                            type="text"
                                            value={icNumber}
                                            onChange={(e) => setIcNumber(e.target.value)}
                                            className="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                            placeholder="Contoh: 010203145678"
                                            required
                                        />
                                    </div>
                                </div>

                                {error && (
                                    <div className="bg-red-50 text-red-500 text-sm p-3 rounded-lg flex items-center">
                                        <i className="fas fa-exclamation-circle mr-2"></i>
                                        {error}
                                    </div>
                                )}

                                <button
                                    type="submit"
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors duration-200 shadow-md flex justify-center items-center"
                                >
                                    Log Masuk <i className="fas fa-arrow-right ml-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // --- SKRIN UTAMA (DASHBOARD) ---
            return (
                <div 
                    className="min-h-screen"
                    style={{ 
                        backgroundImage: "url('sekolah.png')", 
                        backgroundSize: 'cover', 
                        backgroundPosition: 'center', 
                        backgroundAttachment: 'fixed',
                        backgroundColor: 'rgba(243, 244, 246, 0.9)', 
                        backgroundBlendMode: 'overlay'
                    }}
                >
                    {/* Navigation Bar */}
                    <nav className="bg-white shadow-md mb-8">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16">
                                <div className="flex items-center">
                                    <img 
                                        src="logo.png" 
                                        alt="Logo" 
                                        className="w-10 h-10 rounded-full mr-3 border-2 border-blue-500"
                                        onError={(e) => { e.target.onerror = null; e.target.src = "https://via.placeholder.com/40"; }}
                                    />
                                    <span className="text-xl font-bold text-gray-800">Sistem Fail Murid</span>
                                </div>
                                <div className="flex items-center">
                                    <button 
                                        onClick={() => {
                                            setIsAuthenticated(false);
                                            setIcNumber('');
                                        }}
                                        className="text-red-500 hover:text-red-700 font-medium px-4 py-2 rounded-md hover:bg-red-50 transition-colors flex items-center"
                                    >
                                        <i className="fas fa-sign-out-alt mr-2"></i> Log Keluar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Kandungan Utama (Dashboard) */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="bg-white rounded-xl shadow-lg p-6 border border-gray-200 mb-8">
                            <h2 className="text-2xl font-bold text-gray-800 mb-4 border-b pb-2">
                                <i className="fas fa-folder-open text-blue-500 mr-2"></i> Rekod Pelajar
                            </h2>
                            <p className="text-gray-600">
                                Selamat datang ke Sistem Fail Peribadi Murid. Semua rekod dihubungkan dengan pangkalan data awan (Firebase) merentasi pelbagai peranti.
                            </p>
                            
                            {/* Kotak Info */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
                                <div className="bg-blue-50 rounded-lg p-5 border border-blue-100 flex items-center">
                                    <div className="bg-blue-500 text-white rounded-full w-12 h-12 flex items-center justify-center text-xl shadow-sm">
                                        <i className="fas fa-users"></i>
                                    </div>
                                    <div className="ml-4">
                                        <h3 className="text-lg font-semibold text-gray-700">Profil Pelajar</h3>
                                        <p className="text-sm text-gray-500">Kemaskini maklumat</p>
                                    </div>
                                </div>
                                
                                <div className="bg-green-50 rounded-lg p-5 border border-green-100 flex items-center">
                                    <div className="bg-green-500 text-white rounded-full w-12 h-12 flex items-center justify-center text-xl shadow-sm">
                                        <i className="fas fa-file-alt"></i>
                                    </div>
                                    <div className="ml-4">
                                        <h3 className="text-lg font-semibold text-gray-700">Dokumen</h3>
                                        <p className="text-sm text-gray-500">Muat naik fail</p>
                                    </div>
                                </div>

                                <div className="bg-yellow-50 rounded-lg p-5 border border-yellow-100 flex items-center">
                                    <div className="bg-yellow-500 text-white rounded-full w-12 h-12 flex items-center justify-center text-xl shadow-sm">
                                        <i className="fas fa-history"></i>
                                    </div>
                                    <div className="ml-4">
                                        <h3 className="text-lg font-semibold text-gray-700">Arkib</h3>
                                        <p className="text-sm text-gray-500">Rekod terdahulu</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
