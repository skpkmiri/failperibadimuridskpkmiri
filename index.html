<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fail Peribadi Murid - SK PK Miri</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #f8f9fc; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background-color: #f1f5f9; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [icNumber, setIcNumber] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(true);
            
            // Data awal automatik sekiranya fail dibuka secara lokal / offline
            const defaultStudents = [
                { name: 'Ahmad Bin Ali', kelas: '1BP DELIMA', darjah: '1', tahunMasuk: '2026', noPendaftaran: 'BP001', tarikhMasuk: '2026-01-02', jantina: 'Lelaki', bangsa: 'Melayu', asramaHarian: 'Harian', tarikhLahir: '2019-05-12', tempatLahir: 'Miri', namaWaris: 'Ali Bin Abdullah', pekerjaanWaris: 'Penjawat Awam', alamat: 'Miri, Sarawak', icWaris: '800101135000', telRumah: '-', hpWaris: '0123456789', jawatanKhas: 'Ketua Darjah', profilePic: null },
                { name: 'Siti Nurhaliza Binti Abu', kelas: '2BP ZAMRUD', darjah: '2', tahunMasuk: '2025', noPendaftaran: 'BP002', tarikhMasuk: '2025-01-02', jantina: 'Perempuan', bangsa: 'Melayu', asramaHarian: 'Harian', tarikhLahir: '2018-08-20', tempatLahir: 'Miri', namaWaris: 'Abu Bin Samah', pekerjaanWaris: 'Peniaga', alamat: 'Miri, Sarawak', icWaris: '820303136000', telRumah: '-', hpWaris: '0198765432', jawatanKhas: '-', profilePic: null }
            ];

            const [students, setStudents] = useState(defaultStudents);
            const [authorizedIcs, setAuthorizedIcs] = useState([
                '810808135501', '910110136471', '880927135284', '920422135813', '970226135344', 'admin123', '123456'
            ]);

            const [searchTerm, setSearchTerm] = useState('');
            const [viewingFile, setViewingFile] = useState(null); 
            const [activeTab, setActiveTab] = useState('rekod');
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [editForm, setEditForm] = useState(null);

            const [isEditingNotice, setIsEditingNotice] = useState(false);
            const [noticeText, setNoticeText] = useState("Sila pastikan semua maklumat dan rekod fail peribadi murid dikemaskini ke dalam sistem selewat-lewatnya pada hujung bulan ini.\n\nSila rujuk Guru Data sekiranya terdapat sebarang masalah. Terima kasih.");
            const [tempNotice, setTempNotice] = useState("");

            const [newStudent, setNewStudent] = useState({ 
                name: '', kelas: '', darjah: '1', tahunMasuk: '2026', guruKelas: '' 
            });

            const senaraiKandungan = [
                "KAD 001",
                "BORANG MAKLUMAT PELAJAR",
                "BUKU LAPORAN PELAJAR",
                "SALINAN SIJIL LAHIR PELAJAR",
                "SALINAN KAD PENGENALAN",
                "SIJIL - SIJIL KURIKULUM DAN KOKURIKULUM",
                "SURAT KEBENARAN AM IBUBAPA",
                "SALINAN MAKLUMAT DISIPLIN",
                "SALINAN KAD OKU"
            ];

            const senaraiPerkara = [
                { id: 'name', label: 'Nama' },
                { id: 'noPendaftaran', label: 'No. Pendaftaran' },
                { id: 'tarikhMasuk', label: 'Tarikh Masuk Sekolah' },
                { id: 'jantina', label: 'Jantina' },
                { id: 'bangsa', label: 'Bangsa' },
                { id: 'asramaHarian', label: 'Asrama / Harian' },
                { id: 'tarikhLahir', label: 'Tarikh Lahir' },
                { id: 'tempatLahir', label: 'Tempat Lahir' },
                { id: 'namaWaris', label: 'Nama Bapa / Penjaga / Ibu' },
                { id: 'pekerjaanWaris', label: 'Pekerjaan Bapa / Ibu' },
                { id: 'alamat', label: 'Alamat' },
                { id: 'icWaris', label: 'No. Kad Pengenalan Bapa / Ibu / Penjaga' },
                { id: 'telRumah', label: 'No. Telefon Rumah' },
                { id: 'hpWaris', label: 'No. Handphone Bapa / Penjaga / Ibu' },
                { id: 'jawatanKhas', label: 'Jawatan Khas Di Sekolah' }
            ];

            useEffect(() => {
                const fetchCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTy_hVJvUzEnM_cIVpVTn0-2qNk44eGDDHYHggwx1L1m0OwYKS1MsdIqAg_P1UJ6UevBf8EVVJCCiMY/pub?output=csv";
                fetch(fetchCsvUrl)
                    .then(response => response.text())
                    .then(csvText => {
                        const textTanpaSengkang = csvText.replace(/-/g, '');
                        const icDariCsv = textTanpaSengkang.match(/\b\d{12}\b/g) || [];
                        setAuthorizedIcs(prevIcs => [...new Set([...prevIcs, ...icDariCsv])]);

                        const rows = csvText.split('\n').filter(row => row.trim() !== '');
                        if (rows.length > 0) {
                            const headers = rows[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h => h.replace(/^"|"$/g, '').trim().toUpperCase());
                            let nameCol = 0; let classCol = 1;
                            
                            for (let i = 0; i < headers.length; i++) {
                                if (headers[i].includes('NAMA') || headers[i].includes('MURID')) nameCol = i;
                                else if (headers[i].includes('KELAS') || headers[i].includes('TAHUN')) classCol = i;
                            }

                            const parsedStudents = [];
                            for (let i = 1; i < rows.length; i++) {
                                const arr = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                                
                                if (arr.length > Math.max(nameCol, classCol)) {
                                    const namaMurid = arr[nameCol] ? arr[nameCol].replace(/^"|"$/g, '').trim() : '';
                                    const kelasMurid = arr[classCol] ? arr[classCol].replace(/^"|"$/g, '').trim() : '-';
                                    
                                    if (namaMurid && isNaN(namaMurid) && namaMurid !== '-') {
                                        parsedStudents.push({ 
                                            name: namaMurid, 
                                            kelas: kelasMurid,
                                            darjah: '1',
                                            tahunMasuk: '2026',
                                            noPendaftaran: '', tarikhMasuk: '', jantina: '', bangsa: '', 
                                            asramaHarian: '', tarikhLahir: '', tempatLahir: '', namaWaris: '', 
                                            pekerjaanWaris: '', alamat: '', icWaris: '', telRumah: '', 
                                            hpWaris: '', jawatanKhas: '', profilePic: null
                                        });
                                    }
                                }
                            }
                            if(parsedStudents.length > 0) {
                                setStudents(parsedStudents);
                            }
                        }
                    })
                    .catch(err => console.warn("Mod Offline/Lokal: Menggunakan data asas terbina."))
                    .finally(() => setLoading(false));

                const timer = setTimeout(() => setLoading(false), 1000);
                return () => clearTimeout(timer);
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                const cleanInput = icNumber.replace(/-/g, '').trim();
                if (authorizedIcs.includes(cleanInput) || cleanInput === 'admin123' || cleanInput === '123456') {
                    setIsAuthenticated(true); 
                    setError('');
                } else {
                    setError('Nombor Kad Pengenalan tidak sah atau tiada dalam rekod.');
                }
            };

            const handleDownload = () => {
                const csvContent = "data:text/csv;charset=utf-8,Nama Murid,Kelas\n" + 
                                   students.map(e => `"${e.name}","${e.kelas}"`).join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "Senarai_Murid.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const submitNewStudent = (e) => {
                e.preventDefault();
                if(newStudent.name.trim() !== '') {
                    setStudents([{ 
                        ...newStudent,
                        noPendaftaran: '', tarikhMasuk: '', jantina: '', bangsa: '', 
                        asramaHarian: '', tarikhLahir: '', tempatLahir: '', namaWaris: '', 
                        pekerjaanWaris: '', alamat: '', icWaris: '', telRumah: '', 
                        hpWaris: '', jawatanKhas: '', profilePic: null
                    }, ...students]);
                    setNewStudent({ name: '', kelas: '', darjah: '1', tahunMasuk: '2026', guruKelas: '' });
                    setShowAddModal(false);
                }
            };

            const handleDeleteStudent = () => {
                if(window.confirm(`Adakah anda pasti mahu memadam/gugur rekod "${viewingFile.name}" secara kekal?`)) {
                    setStudents(students.filter(s => s.name !== viewingFile.name));
                    setViewingFile(null);
                }
            };

            const handleUpdateStudent = (e) => {
                e.preventDefault();
                const updatedList = students.map(s => {
                    if (s.name === viewingFile.name) {
                        return { ...s, ...editForm };
                    }
                    return s;
                });
                setStudents(updatedList);
                setViewingFile({ ...viewingFile, ...editForm });
                setShowEditModal(false);
            };

            const openEditModal = () => {
                setEditForm({ ...viewingFile });
                setShowEditModal(true);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const updatedList = students.map(s => {
                            if (s.name === viewingFile.name) {
                                return { ...s, profilePic: reader.result };
                            }
                            return s;
                        });
                        setStudents(updatedList);
                        setViewingFile({ ...viewingFile, profilePic: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleDeleteImage = () => {
                const updatedList = students.map(s => {
                    if (s.name === viewingFile.name) {
                        return { ...s, profilePic: null };
                    }
                    return s;
                });
                setStudents(updatedList);
                setViewingFile({ ...viewingFile, profilePic: null });
            };

            const filteredStudents = students.filter(student => 
                student.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                student.kelas.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-xl font-semibold text-gray-600 flex flex-col items-center">
                            <i className="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
                            Memuatkan Sistem...
                        </div>
                    </div>
                );
            }

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center px-4 bg-gray-100">
                        <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-100">
                            <div className="text-center mb-8">
                                <div className="flex justify-center mb-4">
                                    <div className="w-20 h-20 rounded-full bg-blue-600 text-white flex items-center justify-center text-3xl font-bold shadow-lg border-4 border-blue-200">
                                        <i className="fas fa-school"></i>
                                    </div>
                                </div>
                                <h1 className="text-2xl font-bold text-gray-800">Fail Peribadi Murid</h1>
                                <p className="text-gray-500 mt-1 text-sm">SK Pendidikan Khas Miri</p>
                                <p className="text-xs text-blue-600 mt-2 font-medium">Pengujian: Guna Kata Laluan "admin123" atau No. IC</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Nombor Kad Pengenalan / Kata Laluan</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i className="fas fa-id-card text-gray-400"></i>
                                        </div>
                                        <input 
                                            type="text" 
                                            value={icNumber} 
                                            onChange={(e) => setIcNumber(e.target.value)} 
                                            className="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" 
                                            placeholder="Masuk IC atau admin123" 
                                            required 
                                        />
                                    </div>
                                </div>
                                {error && (
                                    <div className="bg-red-50 text-red-500 text-sm p-3 rounded-lg flex items-center">
                                        <i className="fas fa-exclamation-circle mr-2"></i>{error}
                                    </div>
                                )}
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors duration-200 shadow-md flex justify-center items-center">
                                    Log Masuk <i className="fas fa-arrow-right ml-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (viewingFile) {
                return (
                    <div className="min-h-screen bg-[#f8f9fc]">
                        <div className="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
                            <div className="flex-1">
                                <button onClick={() => setViewingFile(null)} className="text-gray-700 hover:text-black font-semibold text-base flex items-center gap-1.5 transition-colors">
                                    <i className="fas fa-chevron-left text-lg"></i> Kembali
                                </button>
                            </div>
                            
                            <div className="flex-1 text-center">
                                <h1 className="text-lg font-bold text-gray-900 tracking-wide uppercase">{viewingFile.name}</h1>
                                <p className="text-xs text-gray-500 font-medium mt-0.5">
                                    {viewingFile.kelas} {viewingFile.darjah ? `(Darjah ${viewingFile.darjah})` : ''} • {viewingFile.tahunMasuk || '2026'}
                                </p>
                            </div>

                            <div className="flex-1 flex justify-end gap-2.5">
                                <button onClick={openEditModal} className="w-9 h-9 flex items-center justify-center text-blue-600 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100 transition-colors shadow-sm" title="Kemaskini Rekod">
                                    <i className="fas fa-pen-to-square"></i>
                                </button>
                                <button onClick={handleDeleteStudent} className="px-3.5 py-1.5 text-red-600 bg-red-50 border border-red-200 rounded-lg hover:bg-red-100 transition-colors flex items-center font-bold text-xs gap-1.5 shadow-sm">
                                    <i className="fas fa-user-minus text-red-500"></i> Gugur
                                </button>
                            </div>
                        </div>

                        <div className="bg-white border-b border-gray-200 flex justify-center gap-12 shadow-sm">
                            <button 
                                onClick={() => setActiveTab('rekod')}
                                className={`py-3.5 px-4 font-bold text-sm flex items-center gap-2 border-b-2 transition-all ${
                                    activeTab === 'rekod' 
                                        ? 'border-blue-600 text-blue-600' 
                                        : 'border-transparent text-gray-500 hover:text-gray-800'
                                }`}
                            >
                                <i className="fas fa-user"></i> Rekod Peribadi
                            </button>
                            <button 
                                onClick={() => setActiveTab('kandungan')}
                                className={`py-3.5 px-4 font-bold text-sm flex items-center gap-2 border-b-2 transition-all ${
                                    activeTab === 'kandungan' 
                                        ? 'border-blue-600 text-blue-600' 
                                        : 'border-transparent text-gray-500 hover:text-gray-800'
                                }`}
                            >
                                <i className="fas fa-folder"></i> Kandungan Fail
                            </button>
                        </div>

                        <div className="max-w-5xl mx-auto mt-6 px-4 pb-12">
                            {activeTab === 'rekod' ? (
                                <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                    <div className="bg-gray-50/60 border-b border-gray-200 px-6 py-3.5 flex justify-between items-center">
                                        <h3 className="font-bold text-gray-800 text-sm tracking-wider uppercase">REKOD PERIBADI MURID</h3>
                                        <button onClick={openEditModal} className="bg-blue-50 text-blue-600 hover:bg-blue-100 px-4 py-1.5 rounded-lg text-xs font-bold border border-blue-200 transition-colors shadow-sm">
                                            Kemaskini
                                        </button>
                                    </div>
                                    
                                    <div className="flex flex-col items-center justify-center py-6 border-b border-gray-200">
                                        <div className="w-28 h-36 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center mb-4 overflow-hidden relative shadow-inner">
                                            {viewingFile.profilePic ? (
                                                <img src={viewingFile.profilePic} alt="Gambar Pasport" className="w-full h-full object-cover" />
                                            ) : (
                                                <div className="text-center p-2 text-gray-400">
                                                    <i className="fas fa-user text-4xl mb-2"></i>
                                                    <p className="text-[10px] uppercase font-bold text-gray-400">Gambar Pasport</p>
                                                </div>
                                            )}
                                        </div>
                                        
                                        <div className="flex gap-2">
                                            <label className="cursor-pointer bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 px-4 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center gap-1.5">
                                                <i className="fas fa-camera"></i> Muat Naik
                                                <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                                            </label>
                                            
                                            {viewingFile.profilePic && (
                                                <button onClick={handleDeleteImage} className="bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 px-4 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center gap-1.5">
                                                    <i className="fas fa-trash-alt"></i> Padam
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-gray-50">
                                            <tr>
                                                <th className="py-3 px-4 w-16 text-gray-700 font-bold border border-gray-300 text-center text-sm">Bil</th>
                                                <th className="py-3 px-4 w-1/3 text-gray-700 font-bold border border-gray-300 text-sm uppercase">PERKARA</th>
                                                <th className="py-3 px-4 text-gray-700 font-bold border border-gray-300 text-sm">MAKLUMAT</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {senaraiPerkara.map((item, index) => (
                                                <tr key={index} className="hover:bg-gray-50 transition-colors">
                                                    <td className="py-3 px-4 text-gray-600 border border-gray-300 text-center font-medium text-sm">{index + 1}</td>
                                                    <td className="py-3 px-4 font-medium text-gray-800 border border-gray-300 text-sm">{item.label}</td>
                                                    <td className="py-3 px-4 text-gray-800 border border-gray-300 text-sm">
                                                        {viewingFile[item.id] || <span className="text-gray-400 italic">Belum diisi</span>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            ) : (
                                <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                    <div className="bg-gray-50/60 border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                                        <h3 className="font-bold text-gray-700 text-sm tracking-wider uppercase"><i className="fas fa-folder-open mr-2 text-blue-600"></i> SENARAI KANDUNGAN FAIL</h3>
                                    </div>
                                    <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {senaraiKandungan.map((dokumen, index) => (
                                            <div key={index} className="flex items-center justify-between p-4 border border-gray-200 rounded-xl hover:shadow-md transition-shadow bg-gray-50/50 hover:bg-white">
                                                <div className="flex items-center space-x-3">
                                                    <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">
                                                        {index + 1}
                                                    </div>
                                                    <span className="text-gray-800 font-semibold text-sm">{dokumen}</span>
                                                </div>
                                                
                                                <label className="cursor-pointer text-gray-600 hover:text-blue-600 bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-xs font-bold transition-colors flex items-center gap-1 shadow-sm">
                                                    <i className="fas fa-upload"></i> Muat Naik
                                                    <input 
                                                        type="file" 
                                                        className="hidden" 
                                                        onChange={(e) => {
                                                            const file = e.target.files[0];
                                                            if (file) {
                                                                alert(`Anda telah memilih fail: "${file.name}" untuk ${dokumen}.`);
                                                            }
                                                        }}
                                                    />
                                                </label>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        {showEditModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col">
                                    <div className="bg-[#1e3a8a] p-5 flex justify-between items-center text-white">
                                        <h3 className="font-bold text-lg flex items-center">
                                            <i className="fas fa-user-edit mr-2"></i> Kemaskini Rekod Peribadi
                                        </h3>
                                        <button onClick={() => setShowEditModal(false)} className="text-white hover:text-blue-200 focus:outline-none">
                                            <i className="fas fa-times text-xl"></i>
                                        </button>
                                    </div>
                                    <form onSubmit={handleUpdateStudent} className="flex flex-col h-full max-h-[75vh]">
                                        <div className="p-6 overflow-y-auto custom-scrollbar flex-grow bg-gray-50 space-y-5">
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Nama Penuh</label>
                                                    <input type="text" value={editForm?.name || ''} onChange={(e) => setEditForm({...editForm, name: e.target.value})} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Kelas</label>
                                                    <input type="text" value={editForm?.kelas || ''} onChange={(e) => setEditForm({...editForm, kelas: e.target.value})} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required />
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Darjah / Tahun</label>
