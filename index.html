<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk - Fail Peribadi Murid</title>
  <style>
    /* Reset & Gaya Asas */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* 2. Latar Belakang Sekolah */
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                  url('sekolah.png') center/cover no-repeat;
    }

    /* Kad Utama */
    .login-card {
      background-color: #f4f5f8;
      width: 100%;
      max-width: 440px;
      padding: 40px 32px 32px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      text-align: center;
      margin: 20px;
    }

    /* 1. Bekas Logo Bulat */
    .logo-wrapper {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: 2px solid #ffffff;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Memastikan logo kelihatan penuh dan tidak terpotong */
    }

    /* Tajuk */
    .title {
      color: #111827;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .subtitle {
      color: #2563eb;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    /* Borang & Input */
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      background-color: #ffffff;
      color: #1f2937;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input::placeholder {
      color: #9ca3af;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Butang Log Masuk */
    .btn-login {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-bottom: 24px;
    }

    .btn-login:hover {
      background-color: #1d4ed8;
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    /* Teks Nota Kaki */
    .disclaimer {
      color: #6b7280;
      font-size: 11.5px;
      line-height: 1.5;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Logo Sekolah dalam Bulatan -->
    <div class="logo-wrapper">
      <img src="logo.png" alt="Logo Sekolah" class="logo-img">
    </div>

    <!-- Tajuk Utama -->
    <h1 class="title">FAIL PERIBADI MURID</h1>
    <h2 class="subtitle">SK PENDIDIKAN KHAS MIRI</h2>

    <!-- Borang Log Masuk -->
    <form action="#" method="POST">
      <div class="form-group">
        <label for="ic_number">No. Kad Pengenalan Guru</label>
        <input 
          type="text" 
          id="ic_number" 
          name="ic_number" 
          placeholder="Contoh: 810808135501" 
          required 
          autocomplete="off"
        >
      </div>

      <button type="submit" class="btn-login">Log Masuk</button>
    </form>

    <!-- Penafian / Nota Kaki -->
    <p class="disclaimer">
      Sistem maklumat sulit. Akses terhad kepada guru yang dibenarkan sahaja.
    </p>
  </div>

</body>
</html>
