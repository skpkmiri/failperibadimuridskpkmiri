<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fail Peribadi Murid - SK PK Miri</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Untuk compile JSX dalam browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
        }
        /* Scrollbar untuk modal/popup */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Modul Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3GRV6VIpECWq48M2jWq_QEQ9RUEbHBBw",
            authDomain: "fail-peribadi-murid.firebaseapp.com",
            projectId: "fail-peribadi-murid",
            storageBucket: "fail-peribadi-murid.firebasestorage.app",
            messagingSenderId: "804840511723",
            appId: "1:804840511723:web:1cbc82e294c55cea21c6ae",
            measurementId: "G-ZRKX0NXHZJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.signInAnonymously = signInAnonymously;
        window.onAuthStateChanged = onAuthStateChanged;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
    </script>

    <!-- Skrip Aplikasi React -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // State Log Masuk & Loading
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [icNumber, setIcNumber] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(true);
            
            // State Data
            const [students, setStudents] = useState([]);
            const [authorizedIcs, setAuthorizedIcs] = useState([
                '810808135501', '910110136471', '880927135284', '920422135813', '970226135344', 'admin123'
            ]);

            // State Fungsi Interaktif
            const [searchTerm, setSearchTerm] = useState('');
            const [viewingFile, setViewingFile] = useState(null); // Ganti modal kecil dengan paparan penuh terus
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [isEditingNotice, setIsEditingNotice] = useState(false);
            const [noticeText, setNoticeText] = useState("Sila pastikan semua maklumat dan rekod fail peribadi murid dikemaskini ke dalam sistem selewat-lewatnya pada hujung bulan ini.\n\nSila rujuk Guru Data sekiranya terdapat sebarang masalah. Terima kasih.");
            const [tempNotice, setTempNotice] = useState("");

            const [newStudent, setNewStudent] = useState({ 
                name: '', kelas: '', darjah: '', tahunMasuk: '2026', guruKelas: '' 
            });

            useEffect(() => {
                // 1. Muat turun data CSV
                const fetchCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTy_hVJvUzEnM_cIVpVTn0-2qNk44eGDDHYHggwx1L1m0OwYKS1MsdIqAg_P1UJ6UevBf8EVVJCCiMY/pub?output=csv";
                fetch(fetchCsvUrl)
                    .then(response => response.text())
                    .then(csvText => {
                        const textTanpaSengkang = csvText.replace(/-/g, '');
                        const icDariCsv = textTanpaSengkang.match(/\b\d{12}\b/g) || [];
                        setAuthorizedIcs(prevIcs => [...new Set([...prevIcs, ...icDariCsv])]);

                        const rows = csvText.split('\n').filter(row => row.trim() !== '');
                        if (rows.length > 0) {
                            const headers = rows[0].split(',').map(h => h.trim().toUpperCase());
                            let nameCol = 0; let classCol = 1;
                            
                            for (let i = 0; i < headers.length; i++) {
                                if (headers[i].includes('NAMA') || headers[i].includes('MURID')) nameCol = i;
                                else if (headers[i].includes('KELAS') || headers[i].includes('TAHUN')) classCol = i;
                            }

                            const parsedStudents = [];
                            for (let i = 1; i < rows.length; i++) {
                                const arr = rows[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
                                const namaMurid = arr[nameCol] ? arr[nameCol].replace(/"/g, '') : '';
                                const kelasMurid = arr[classCol] ? arr[classCol].replace(/"/g, '') : '-';
                                
                                if (namaMurid && isNaN(namaMurid) && namaMurid !== '-') {
                                    parsedStudents.push({ name: namaMurid, kelas: kelasMurid });
                                }
                            }
                            setStudents(parsedStudents);
                        }
                    })
                    .catch(err => console.error("Ralat memuat turun data CSV:", err));

                // 2. Sambungan Firebase berserta Error Handling (Penyelesaian Isu Loading Tersangkut)
                const fallbackTimer = setTimeout(() => {
                    setLoading(false); // Paksa buang loading screen selepas 3 saat walaupun Firebase gagal
                }, 3000);

                const checkFirebase = setInterval(() => {
                    if (window.firebaseAuth) {
                        clearInterval(checkFirebase);
                        window.signInAnonymously(window.firebaseAuth)
                            .then(() => {
                                window.onAuthStateChanged(window.firebaseAuth, (user) => {
                                    clearTimeout(fallbackTimer);
                                    setLoading(false);
                                });
                            })
                            .catch((error) => {
                                console.error("Ralat Firebase:", error);
                                clearTimeout(fallbackTimer);
                                setLoading(false); // Membenarkan aplikasi diteruskan walaupun Firebase ralat
                            });
                    }
                }, 100);

                return () => {
                    clearInterval(checkFirebase);
                    clearTimeout(fallbackTimer);
                };
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                const cleanInput = icNumber.replace(/-/g, '');
                if (authorizedIcs.includes(cleanInput)) {
                    setIsAuthenticated(true); setError('');
                } else {
                    setError('Nombor Kad Pengenalan tidak sah atau tiada dalam rekod.');
                }
            };

            const handleDownload = () => {
                const csvContent = "data:text/csv;charset=utf-8,Nama Murid,Kelas\n" + 
                                   students.map(e => `"${e.name}","${e.kelas}"`).join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "Senarai_Murid.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleArchive = () => {
                alert("Fungsi Arkib sedang diselenggara.");
            };

            const submitNewStudent = (e) => {
                e.preventDefault();
                if(newStudent.name.trim() !== '') {
                    setStudents([{ name: newStudent.name.toUpperCase(), kelas: newStudent.kelas.toUpperCase() }, ...students]);
                    setNewStudent({ name: '', kelas: '', darjah: '', tahunMasuk: '2026', guruKelas: '' });
                    setShowAddModal(false);
                }
            };

            const filteredStudents = students.filter(student => 
                student.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                student.kelas.toLowerCase().includes(searchTerm.toLowerCase())
            );

            // Skrin Loading
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-xl font-semibold text-gray-600 flex flex-col items-center">
                            <i className="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
                            Memuatkan Sistem...
                        </div>
                    </div>
                );
            }

            // Skrin Log Masuk
            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center px-4" 
                         style={{ backgroundImage: "url('sekolah.png')", backgroundSize: 'cover', backgroundPosition: 'center', backgroundAttachment: 'fixed', backgroundColor: 'rgba(255, 255, 255, 0.7)', backgroundBlendMode: 'overlay' }}>
                        <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-100">
                            <div className="text-center mb-8">
                                <div className="flex justify-center mb-4">
                                    <img src="logo.png" alt="Logo Sekolah" className="w-24 h-24 rounded-full object-cover border-4 border-blue-500 shadow-lg bg-gray-50" onError={(e) => { e.target.onerror = null; e.target.src = "https://via.placeholder.com/150?text=Logo"; }} />
                                </div>
                                <h1 className="text-2xl font-bold text-gray-800">Fail Peribadi Murid</h1>
                                <p className="text-gray-500 mt-2">Sila log masuk untuk mengakses rekod</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Nombor Kad Pengenalan</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i className="fas fa-id-card text-gray-400"></i>
                                        </div>
                                        <input type="text" value={icNumber} onChange={(e) => setIcNumber(e.target.value)} className="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="Contoh: 010203145678" required />
                                    </div>
                                </div>
                                {error && (
                                    <div className="bg-red-50 text-red-500 text-sm p-3 rounded-lg flex items-center">
                                        <i className="fas fa-exclamation-circle mr-2"></i>{error}
                                    </div>
                                )}
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors duration-200 shadow-md flex justify-center items-center">
                                    Log Masuk <i className="fas fa-arrow-right ml-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // HALAMAN FAIL PERIBADI PENUH
            // ==========================================
            if (viewingFile) {
                return (
                    <div className="min-h-screen bg-[#f8f9fc]">
                        {/* Header Atas */}
                        <div className="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
                            <div className="flex-1">
                                <button onClick={() => setViewingFile(null)} className="text-[#4b5563] hover:text-black font-semibold text-lg flex items-center">
                                    <i className="fas fa-angle-left text-2xl mr-2"></i> Kembali
                                </button>
                            </div>
                            
                            <div className="flex-1 text-center">
                                <h1 className="text-xl font-bold text-gray-900 uppercase">{viewingFile.name}</h1>
                                <p className="text-sm text-gray-500 font-medium">{viewingFile.kelas} • 2026</p>
                            </div>

                            <div className="flex-1 flex justify-end gap-3">
                                <button className="w-10 h-10 flex items-center justify-center text-blue-600 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100 transition-colors">
                                    <i className="fas fa-edit"></i>
                                </button>
                                <button className="px-4 py-2 text-[#dc2626] bg-[#fef2f2] border border-[#fecaca] rounded-lg hover:bg-[#fee2e2] transition-colors flex items-center font-bold text-sm">
                                    <i className="fas fa-user-minus mr-2"></i> Gugur
                                </button>
                            </div>
                        </div>

                        {/* Kandungan Fail */}
                        <div className="max-w-5xl mx-auto mt-8 px-4 pb-12">
                            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                
                                {/* Bahagian Gambar Profil */}
                                <div className="flex flex-col items-center justify-center py-10">
                                    <div className="w-32 h-32 bg-gray-200 rounded-2xl flex items-center justify-center mb-4">
                                        <i className="fas fa-user text-6xl text-gray-400"></i>
                                    </div>
                                    <p className="text-gray-400 italic font-medium">Tiada gambar profil</p>
                                </div>

                                {/* Jadual Maklumat */}
                                <table className="w-full text-left border-collapse border-t border-gray-200">
                                    <thead className="bg-[#f8fafc]">
                                        <tr>
                                            <th className="py-4 px-6 w-20 text-[#64748b] font-bold border-r border-b border-gray-200 text-center">Bil</th>
                                            <th className="py-4 px-6 w-1/3 text-[#64748b] font-bold border-r border-b border-gray-200">PERKARA</th>
                                            <th className="py-4 px-6 text-[#64748b] font-bold border-b border-gray-200">MAKLUMAT</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr className="hover:bg-gray-50 transition-colors">
                                            <td className="py-5 px-6 text-gray-500 border-r border-b border-gray-200 text-center">1</td>
                                            <td className="py-5 px-6 font-bold text-gray-800 border-r border-b border-gray-200">Nama</td>
                                            <td className="py-5 px-6 text-gray-800 uppercase font-medium border-b border-gray-200">{viewingFile.name}</td>
                                        </tr>
                                        <tr className="hover:bg-gray-50 transition-colors">
                                            <td className="py-5 px-6 text-gray-500 border-r border-b border-gray-200 text-center">2</td>
                                            <td className="py-5 px-6 font-bold text-gray-800 border-r border-b border-gray-200">No. Pendaftaran</td>
                                            <td className="py-5 px-6 text-gray-400 italic border-b border-gray-200">Tiada maklumat</td>
                                        </tr>
                                        <tr className="hover:bg-gray-50 transition-colors">
                                            <td className="py-5 px-6 text-gray-500 border-r border-b border-gray-200 text-center">3</td>
                                            <td className="py-5 px-6 font-bold text-gray-800 border-r border-b border-gray-200">Tarikh Masuk Sekolah</td>
                                            <td className="py-5 px-6 text-gray-400 italic border-b border-gray-200">Tiada maklumat</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // HALAMAN UTAMA (DASHBOARD)
            // ==========================================
            return (
                <div className="min-h-screen relative" style={{ backgroundImage: "url('sekolah.png')", backgroundSize: 'cover', backgroundPosition: 'center', backgroundAttachment: 'fixed', backgroundColor: 'rgba(243, 244, 246, 0.9)', backgroundBlendMode: 'overlay' }}>
                    
                    {/* Header Banner */}
                    <nav className="bg-[#2a459b] shadow-md relative z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-xl md:text-2xl font-bold text-white tracking-wide uppercase">Fail Peribadi Murid</h1>
                                    <p className="text-blue-100 text-sm mt-1 uppercase">SK Pendidikan Khas Miri</p>
                                </div>
                                <button onClick={() => { setIsAuthenticated(false); setIcNumber(''); }} className="text-white hover:text-blue-200 font-medium px-4 py-2 transition-colors flex items-center">
                                    <i className="fas fa-sign-out-alt mr-2"></i> Log Keluar
                                </button>
                            </div>
                        </div>
                    </nav>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 pb-20 relative z-10">
                        
                        {/* Seksyen Makluman */}
                        <div className="bg-[#f0f4ff] rounded-xl border border-blue-200 p-5 mb-6 shadow-sm">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center space-x-4">
                                    <div className="bg-[#dfe6ff] text-blue-700 rounded-lg w-12 h-12 flex items-center justify-center text-xl shadow-sm">
                                        <i className="fas fa-bullhorn"></i>
                                    </div>
                                    <h2 className="text-[#1a3673] font-bold text-lg">PAPAN MAKLUMAN / TINDAKAN</h2>
                                </div>
                                <button 
                                    onClick={() => { setTempNotice(noticeText); setIsEditingNotice(!isEditingNotice); }}
                                    className="bg-[#dfe6ff] text-blue-700 hover:bg-blue-200 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center"
                                >
                                    <i className={isEditingNotice ? "fas fa-times mr-2" : "fas fa-edit mr-2"}></i> 
                                    {isEditingNotice ? "Batal" : "Kemaskini"}
                                </button>
                            </div>
                            
                            <div className="bg-white rounded-lg p-5 border border-blue-50">
                                <h3 className="font-bold text-[#1a3673] flex items-center mb-2">
                                    <span className="text-pink-600 mr-2"><i className="fas fa-bullhorn"></i></span> 
                                    MAKLUMAN GURU DATA:
                                </h3>
                                
                                {isEditingNotice ? (
                                    <div className="mt-3">
                                        <textarea 
                                            className="w-full p-3 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none custom-scrollbar"
                                            rows="4"
                                            value={tempNotice}
                                            onChange={(e) => setTempNotice(e.target.value)}
                                        ></textarea>
                                        <div className="mt-3 flex justify-end">
                                            <button 
                                                onClick={() => { setNoticeText(tempNotice); setIsEditingNotice(false); }}
                                                className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium shadow-sm transition-colors"
                                            >
                                                Simpan Makluman
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-[#1a3673] font-medium leading-relaxed whitespace-pre-wrap">
                                        {noticeText}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Bar Carian & Butang Tindakan */}
                        <div className="flex flex-col md:flex-row gap-4 mb-6">
                            <div className="flex-grow">
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i className="fas fa-search text-gray-400"></i>
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="Cari nama murid atau kelas..." 
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full h-12 pl-11 pr-5 rounded-lg border-none shadow-sm focus:ring-2 focus:ring-blue-500 text-gray-700"
                                    />
                                </div>
                            </div>
                            <div className="flex gap-3 overflow-x-auto pb-2 md:pb-0">
                                <button onClick={() => setShowAddModal(true)} className="bg-[#2563eb] hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-medium shadow-sm transition-colors flex items-center whitespace-nowrap">
                                    <i className="fas fa-user-plus mr-2"></i> Tambah Murid
                                </button>
                                <button onClick={handleDownload} className="bg-[#16a34a] hover:bg-green-700 text-white px-5 py-3 rounded-lg font-medium shadow-sm transition-colors flex items-center whitespace-nowrap">
                                    <i className="fas fa-download mr-2"></i> Muat Turun
                                </button>
                                <button onClick={handleArchive} className="bg-[#374151] hover:bg-gray-800 text-white px-5 py-3 rounded-lg font-medium shadow-sm transition-colors flex items-center whitespace-nowrap">
                                    <i className="fas fa-archive mr-2"></i> Arkib
                                </button>
                            </div>
                        </div>

                        {/* Jadual Nama Murid */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-10">
                            <table className="w-full text-left border-collapse">
                                <thead className="bg-white border-b border-gray-100">
                                    <tr>
                                        <th className="py-4 px-6 font-semibold text-gray-600 text-sm">Nama Murid</th>
                                        <th className="py-4 px-6 font-semibold text-gray-600 text-sm w-48">Kelas</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredStudents.length > 0 ? (
                                        filteredStudents.map((student, index) => (
                                            // Terus buka halaman penuh bila baris ditekan
                                            <tr 
                                                key={index} 
                                                onClick={() => setViewingFile(student)}
                                                className="border-b border-gray-50 hover:bg-blue-50 cursor-pointer transition-colors"
                                            >
                                                <td className="py-4 px-6 font-bold text-gray-800 uppercase">{student.name}</td>
                                                <td className="py-4 px-6 text-gray-500 uppercase">{student.kelas}</td>
                                            </tr>
                                        ))
                                    ) : (
                                        <tr>
                                            <td colSpan="2" className="py-8 px-6 text-center text-gray-500">
                                                {searchTerm ? (
                                                    <span><i className="fas fa-search-minus mr-2"></i> Tiada padanan dijumpai untuk "{searchTerm}"</span>
                                                ) : (
                                                    <span><i className="fas fa-spinner fa-spin mr-2"></i> Sedang memuatkan senarai nama atau tiada rekod...</span>
                                                )}
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* MODAL: Tambah Murid */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col">
                                <div className="bg-[#2563eb] p-5 flex justify-between items-center text-white">
                                    <h3 className="font-bold text-lg flex items-center">
                                        <i className="fas fa-user-plus mr-2"></i> Tambah Murid Baharu
                                    </h3>
                                    <button onClick={() => setShowAddModal(false)} className="text-white hover:text-blue-200 focus:outline-none">
                                        <i className="fas fa-times text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={submitNewStudent} className="p-6">
                                    <div className="space-y-5">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-1.5">Nama Penuh Murid</label>
                                            <input 
                                                type="text" required
                                                value={newStudent.name} 
                                                onChange={(e) => setNewStudent({...newStudent, name: e.target.value})}
                                                className="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase text-gray-700"
                                                placeholder="CONTOH: AHMAD BIN ALI"
                                            />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-1.5">Kelas</label>
                                                <input 
                                                    type="text" required
                                                    value={newStudent.kelas} 
                                                    onChange={(e) => setNewStudent({...newStudent, kelas: e.target.value})}
                                                    className="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase text-gray-700"
                                                    placeholder="CONTOH: 1BD"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-1.5">Darjah / Tahun</label>
                                                <input 
                                                    type="text" required
                                                    value={newStudent.darjah} 
                                                    onChange={(e) => setNewStudent({...newStudent, darjah: e.target.value})}
                                                    className="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase text-gray-700"
                                                    placeholder="CONTOH: 1"
                                                />
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-1.5">Tahun Kemasukan</label>
                                                <input 
                                                    type="number" required
                                                    value={newStudent.tahunMasuk} 
                                                    onChange={(e) => setNewStudent({...newStudent, tahunMasuk: e.target.value})}
                                                    className="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-700"
                                                    placeholder="2026"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-1.5">Nama Guru Kelas</label>
                                                <input 
                                                    type="text"
                                                    value={newStudent.guruKelas} 
                                                    onChange={(e) => setNewStudent({...newStudent, guruKelas: e.target.value})}
                                                    className="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-700"
                                                    placeholder="Opsional"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="pt-6 flex gap-4 mt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowAddModal(false)} 
                                            className="w-1/2 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition-colors focus:outline-none"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="w-1/2 py-3 bg-[#2563eb] text-white rounded-xl font-bold hover:bg-blue-700 transition-colors focus:outline-none"
                                        >
                                            Simpan Murid
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
