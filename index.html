            const files = Array.from(event.target.files);

              const newDocs = files.map(file => ({

                name: file.name,
                url: URL.createObjectURL(file),
                type: file.type
              }));

              setUploadedDocuments(prev => {
                const studentDocs = prev[studentId] || {};
                const existingCategoryDocs = studentDocs[category] || [];
                const normalizedExisting = Array.isArray(existingCategoryDocs) 
                  ? existingCategoryDocs 
                  : (existingCategoryDocs.url ? [existingCategoryDocs] : []);

                return {
                  ...prev,
                  [studentId]: {
                    ...studentDocs,
                    [category]: [...normalizedExisting, ...newDocs]
                  }
                };
              });
            }
          };

          const handleFileDelete = (studentId, category, fileIdOrIndex) => {
            setUploadedDocuments(prev => {
              const studentDocs = prev[studentId] || {};
              const existingCategoryDocs = studentDocs[category] || [];
              const normalizedExisting = Array.isArray(existingCategoryDocs) 
                  ? existingCategoryDocs 
                  : (existingCategoryDocs.url ? [existingCategoryDocs] : []);

              const updatedDocs = normalizedExisting.filter((doc, idx) => 
                doc.id ? doc.id !== fileIdOrIndex : idx !== fileIdOrIndex

              return {

                [studentId]: {

            if (doc.type.startsWith('image/')) {

              iframe.style.position = 'fixed';
              iframe.style.width = '0';
              iframe.style.height = '0';
              iframe.style.border = 'none';
              document.body.appendChild(iframe);

              iframe.contentWindow.document.open();
              iframe.contentWindow.document.write(`
                <html>
                  <head><title>Cetak Gambar</title></head>
                  <body style="margin:0; display:flex; justify-content:center; align-items:center;">
                    <img id="img-to-print" src="${doc.url}" style="max-width:100%; max-height:100vh; object-fit:contain;" />
                  </body>
                </html>
              `);
              iframe.contentWindow.document.close();

              const img = iframe.contentWindow.document.getElementById('img-to-print');
              if (img) {
                img.onload = () => {
                  setTimeout(() => {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                    setTimeout(() => document.body.removeChild(iframe), 3000);

                {activeTab === 'kandungan' && (
                  <div className="space-y-4">
                    <div className="bg-yellow-50/95 backdrop-blur-sm border border-yellow-300 p-4 rounded-xl flex items-start mb-6 shadow-sm">
                      <Icon name="lock" className="text-xl text-yellow-600 mr-3 mt-0.5 flex-shrink-0" />
                      <div>
                        <h4 className="font-semibold text-yellow-800 text-sm">Dokumen Sulit</h4>
                        <p className="text-yellow-700 text-xs mt-1">Kandungan di bawah adalah sulit dan disulitkan untuk akses pengguna yang sah sahaja. Anda boleh muat naik berbilang dokumen bagi setiap kategori.</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {DOCUMENT_CATEGORIES.map((doc, idx) => {
                        const rawDocData = uploadedDocuments[selectedStudent?.id]?.[doc];
                        const docList = Array.isArray(rawDocData) 
                          ? rawDocData 
                          : (rawDocData?.url ? [rawDocData] : []);

                        return (
                          <div key={idx} className="bg-white/90 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-gray-200 transition-all flex flex-col group hover:border-blue-300">
                            <div className="flex items-center justify-between mb-3 border-b border-gray-100 pb-3">
                              <div className="flex items-center flex-1 pr-2">
                                <Icon name="folder-open" className="text-xl text-blue-500 mr-2 flex-shrink-0" />
                                <h4 className="font-bold text-gray-800 text-xs sm:text-sm truncate" title={doc}>{doc}</h4>
                              </div>
                              <label className="p-1.5 px-3 bg-blue-50 text-blue-700 hover:bg-blue-600 hover:text-white border border-blue-200 hover:border-blue-600 rounded-lg transition-colors flex items-center justify-center cursor-pointer flex-shrink-0 shadow-sm" title="Muat Naik Fail">
                                <Icon name="upload" className="text-sm mr-1.5" /> 
                                <span className="text-xs font-semibold">Muat Naik</span>
                                <input type="file" multiple className="hidden" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onChange={(e) => handleFileUpload(selectedStudent.id, doc, e)} />
                              </label>
                            </div>
                            
                            <div className="space-y-2 flex-1">
                              {docList.length > 0 ? (
                                docList.map((file, fileIdx) => (
                                  <div key={file.id || fileIdx} className="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg border border-gray-200 hover:bg-white transition-colors">
                                    <div className="flex items-center flex-1 min-w-0 mr-3">
                                      <Icon name="file-contract" className="text-base text-green-600 mr-2 flex-shrink-0" />
                                      <p className="text-xs font-medium text-gray-700 truncate" title={file.name}>{file.name}</p>
                                    </div>
                                    <div className="flex space-x-1.5 flex-shrink-0">
                                      <button onClick={() => setPreviewDoc({ url: file.url, type: file.type, name: file.name })} className="p-1.5 w-7 h-7 flex items-center justify-center bg-purple-50 text-purple-700 hover:bg-purple-600 hover:text-white border border-purple-200 rounded-md transition-colors" title="Papar Dokumen">
                                        <Icon name="eye" className="text-sm" />
                                      </button>
                                      <button onClick={() => handlePrint(file)} className="p-1.5 w-7 h-7 flex items-center justify-center bg-orange-50 text-orange-700 hover:bg-orange-600 hover:text-white border border-orange-200 rounded-md transition-colors" title="Cetak Dokumen">
                                        <Icon name="print" className="text-sm" />
                                      </button>
                                      <a href={file.url} download={file.name} className="p-1.5 w-7 h-7 flex items-center justify-center bg-blue-50 text-blue-700 hover:bg-blue-600 hover:text-white border border-blue-200 rounded-md transition-colors" title="Muat Turun">
                                        <Icon name="download" className="text-sm" />
                                      </a>
                                      <button onClick={() => handleFileDelete(selectedStudent.id, doc, file.id || fileIdx)} className="p-1.5 w-7 h-7 flex items-center justify-center bg-red-50 text-red-700 hover:bg-red-600 hover:text-white border border-red-200 rounded-md transition-colors" title="Padam">
                                        <Icon name="trash-alt" className="text-sm" />
                                      </button>
                                    </div>
                                  </div>
                                ))
                              ) : (
                                <div className="flex flex-col items-center justify-center py-5 text-gray-400 bg-gray-50/50 rounded-lg border border-dashed border-gray-200">
                                  <Icon name="file-alt" className="text-2xl mb-1 opacity-40" />
                                  <span className="text-[11px] font-medium">Tiada dokumen dimuat naik</span>
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </main>

              {showEditProfileModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
                  <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
                    <div className="bg-blue-600 p-4 flex justify-between items-center text-white">
                      <h3 className="font-bold text-lg flex items-center">
                        <Icon name="edit" className="text-xl mr-2" /> Kemaskini Profil Asas
                      </h3>
                      <button onClick={() => setShowEditProfileModal(false)} className="hover:bg-blue-700 p-1 rounded-full transition-colors w-7 h-7 flex items-center justify-center">
                        <Icon name="times" className="text-base" />
                      </button>
                    </div>
                    <form onSubmit={handleUpdateProfile} className="p-6 space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Nama Penuh Murid</label>
                        <input required type="text" value={profileForm.nama} onChange={e => setProfileForm({...profileForm, nama: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 uppercase outline-none" />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">Kelas Semasa</label>
                          <input required type="text" value={profileForm.kelas} onChange={e => setProfileForm({...profileForm, kelas: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 uppercase outline-none" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">Darjah / Tahun</label>
                          <input required type="text" value={profileForm.darjah} onChange={e => setProfileForm({...profileForm, darjah: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" />
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">Tahun Kemasukan</label>
                          <input required type="number" value={profileForm.tahun} onChange={e => setProfileForm({...profileForm, tahun: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">Nama Guru Kelas</label>
                          <input type="text" value={profileForm.guru} onChange={e => setProfileForm({...profileForm, guru: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" />
                        </div>
                      </div>
                      <div className="pt-4 flex space-x-3">
                        <button type="button" onClick={() => setShowEditProfileModal(false)} className="flex-1 py-3 bg-gray-100 text-gray-700 font-semibold rounded-xl hover:bg-gray-200 transition-colors">Batal</button>
                        <button type="submit" className="flex-1 py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors shadow-md">Sahkan & Simpan</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {showDropConfirm && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
                  <form onSubmit={handleDropStudent} className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden">
                    <div className="bg-red-600 p-4 text-center">
                      <Icon name="user-minus" className="text-4xl text-white mx-auto mb-2" />
                      <h3 className="text-lg font-bold text-white">Gugurkan Murid?</h3>
                    </div>
                    
                    <div className="p-6">
                      <p className="text-sm text-gray-600 mb-4 text-center">
                        Memindahkan <span className="font-bold text-gray-900">{selectedStudent?.nama}</span> ke dalam Arkib. Sila nyatakan sebab pengguguran:
                      </p>
                      
                      <div className="mb-6">
                        <label className="block text-sm font-semibold text-gray-700 mb-2">Sebab Gugur</label>
                        <select 
                          value={dropReason}
                          onChange={(e) => setDropReason(e.target.value)}
                          className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 bg-gray-50 outline-none"
                          required
                        >
                          <option value="Pindah Sekolah">Pindah Sekolah</option>
                          <option value="Naik Tingkatan">Naik Tingkatan</option>
                          <option value="Berhenti Sekolah">Berhenti Sekolah</option>
                        </select>
                      </div>

                      <div className="flex space-x-3">
                        <button type="button" onClick={() => setShowDropConfirm(false)} className="flex-1 py-3 bg-gray-100 text-gray-700 font-semibold rounded-xl hover:bg-gray-200 transition-colors">Batal</button>
                        <button type="submit" className="flex-1 py-3 bg-red-600 text-white font-semibold rounded-xl hover:bg-red-700 transition-colors shadow-md">Sahkan & Gugur</button>
                      </div>
                    </div>
                  </form>
                </div>
              )}

              {previewDoc && renderPreview(previewDoc)}

            </div>
          );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
