<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fail Peribadi Murid - SK PK Miri</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3GRV6VIpECWq48M2jWq_QEQ9RUEbHBBw",
            authDomain: "fail-peribadi-murid.firebaseapp.com",
            projectId: "fail-peribadi-murid",
            storageBucket: "fail-peribadi-murid.firebasestorage.app",
            messagingSenderId: "804840511723",
            appId: "1:804840511723:web:1cbc82e294c55cea21c6ae",
            measurementId: "G-ZRKX0NXHZJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.signInAnonymously = signInAnonymously;
        window.onAuthStateChanged = onAuthStateChanged;
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [icNumber, setIcNumber] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(true);
            
            const [students, setStudents] = useState([]);
            const [authorizedIcs, setAuthorizedIcs] = useState([
                '810808135501', '910110136471', '880927135284', '920422135813', '970226135344', 'admin123'
            ]);

            const [searchTerm, setSearchTerm] = useState('');
            const [selectedStudent, setSelectedStudent] = useState(null); // Untuk Modal Kecil
            const [viewingFile, setViewingFile] = useState(null); // Untuk Halaman Fail Peribadi Penuh
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [isEditingNotice, setIsEditingNotice] = useState(false);
            const [noticeText, setNoticeText] = useState("Sila pastikan semua maklumat dan rekod fail peribadi murid dikemaskini ke dalam sistem selewat-lewatnya pada hujung bulan ini.");
            const [tempNotice, setTempNotice] = useState("");

            const [newStudent, setNewStudent] = useState({ name: '', kelas: '', darjah: '', tahunMasuk: '2026', guruKelas: '' });

            useEffect(() => {
                const fetchCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTy_hVJvUzEnM_cIVpVTn0-2qNk44eGDDHYHggwx1L1m0OwYKS1MsdIqAg_P1UJ6UevBf8EVVJCCiMY/pub?output=csv";
                
                fetch(fetchCsvUrl)
                    .then(response => response.text())
                    .then(csvText => {
                        const textTanpaSengkang = csvText.replace(/-/g, '');
                        const icDariCsv = textTanpaSengkang.match(/\b\d{12}\b/g) || [];
                        setAuthorizedIcs(prevIcs => [...new Set([...prevIcs, ...icDariCsv])]);

                        const rows = csvText.split('\n').filter(row => row.trim() !== '');
                        if (rows.length > 0) {
                            const headers = rows[0].split(',').map(h => h.trim().toUpperCase());
                            let nameCol = 0; let classCol = 1;
                            
                            for (let i = 0; i < headers.length; i++) {
                                if (headers[i].includes('NAMA') || headers[i].includes('MURID')) nameCol = i;
                                else if (headers[i].includes('KELAS') || headers[i].includes('TAHUN')) classCol = i;
                            }

                            const parsedStudents = [];
                            for (let i = 1; i < rows.length; i++) {
                                const arr = rows[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
                                const namaMurid = arr[nameCol] ? arr[nameCol].replace(/"/g, '') : '';
                                const kelasMurid = arr[classCol] ? arr[classCol].replace(/"/g, '') : '-';
                                
                                if (namaMurid && isNaN(namaMurid)) {
                                    parsedStudents.push({ name: namaMurid, kelas: kelasMurid });
                                }
                            }
                            setStudents(parsedStudents);
                        }
                    })
                    .catch(err => console.error(err));

                const checkFirebase = setInterval(() => {
                    if (window.firebaseAuth) {
                        clearInterval(checkFirebase);
                        window.signInAnonymously(window.firebaseAuth).then(() => {
                            window.onAuthStateChanged(window.firebaseAuth, (user) => { if (user) setLoading(false); });
                        });
                    }
                }, 100);
                return () => clearInterval(checkFirebase);
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                const cleanInput = icNumber.replace(/-/g, '');
                if (authorizedIcs.includes(cleanInput)) { setIsAuthenticated(true); setError(''); } 
                else { setError('No. KP tidak sah atau tiada dalam rekod.'); }
            };

            // Fungsi ini dipanggil apabila butang "Buka Fail Peribadi" diklik
            const handleBukaFail = (student) => {
                setSelectedStudent(null); // Tutup modal kecil
                setViewingFile(student);  // Buka halaman fail penuh
            };

            const submitNewStudent = (e) => {
                e.preventDefault();
                if(newStudent.name.trim() !== '') {
                    setStudents([{ name: newStudent.name.toUpperCase(), kelas: newStudent.kelas.toUpperCase() }, ...students]);
                    setNewStudent({ name: '', kelas: '', darjah: '', tahunMasuk: '2026', guruKelas: '' });
                    setShowAddModal(false);
                }
            };

            const filteredStudents = students.filter(student => 
                student.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                student.kelas.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-gray-100"><i className="fas fa-spinner fa-spin text-2xl text-blue-600"></i></div>;

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center px-4 bg-gray-100">
                        <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
                            <h1 className="text-2xl font-bold text-center mb-6">Fail Peribadi Murid</h1>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="text" value={icNumber} onChange={(e) => setIcNumber(e.target.value)} className="w-full px-4 py-3 border rounded-lg" placeholder="No Kad Pengenalan" required />
                                {error && <div className="text-red-500 text-sm">{error}</div>}
                                <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg">Log Masuk</button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // HALAMAN FAIL PERIBADI PENUH (BARU DITAMBAH)
            // ==========================================
            if (viewingFile) {
                return (
                    <div className="min-h-screen bg-[#f8f9fc]">
                        {/* Header Navigation Bar */}
                        <div className="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
                            <div className="flex-1">
                                <button onClick={() => setViewingFile(null)} className="text-[#4b5563] hover:text-black font-semibold text-lg flex items-center">
                                    <i className="fas fa-angle-left text-2xl mr-2"></i> Kembali
                                </button>
                            </div>
                            
                            <div className="flex-1 text-center">
                                <h1 className="text-xl font-bold text-gray-900 uppercase">{viewingFile.name}</h1>
                                <p className="text-sm text-gray-500 font-medium">{viewingFile.kelas} • 2026</p>
                            </div>

                            <div className="flex-1 flex justify-end gap-3">
                                <button className="w-10 h-10 flex items-center justify-center text-blue-600 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100 transition-colors">
                                    <i className="fas fa-edit"></i>
                                </button>
                                <button className="px-4 py-2 text-[#dc2626] bg-[#fef2f2] border border-[#fecaca] rounded-lg hover:bg-[#fee2e2] transition-colors flex items-center font-bold text-sm">
                                    <i className="fas fa-user-minus mr-2"></i> Gugur
                                </button>
                            </div>
                        </div>

                        {/* Content Area */}
                        <div className="max-w-5xl mx-auto mt-8 px-4 pb-12">
                            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                
                                {/* Profile Picture Section */}
                                <div className="flex flex-col items-center justify-center py-10">
                                    <div className="w-32 h-32 bg-gray-200 rounded-2xl flex items-center justify-center mb-4">
                                        <i className="fas fa-user text-6xl text-gray-400"></i>
                                    </div>
                                    <p className="text-gray-400 italic font-medium">Tiada gambar profil</p>
                                </div>

                                {/* Table Details */}
                                <table className="w-full text-left border-collapse border-t border-gray-200">
                                    <thead className="bg-[#f8fafc]">
                                        <tr>
                                            <th className="py-4 px-6 w-20 text-[#64748b] font-bold border-r border-b border-gray-200 text-center">Bil</th>
                                            <th className="py-4 px-6 w-1/3 text-[#64748b] font-bold border-r border-b border-gray-200">PERKARA</th>
                                            <th className="py-4 px-6 text-[#64748b] font-bold border-b border-gray-200">MAKLUMAT</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr className="hover:bg-gray-50 transition-colors">
                                            <td className="py-5 px-6 text-gray-500 border-r border-b border-gray-200 text-center">1</td>
                                            <td className="py-5 px-6 font-bold text-gray-800 border-r border-b border-gray-200">Nama</td>
                                            <td className="py-5 px-6 text-gray-800 uppercase font-medium border-b border-gray-200">{viewingFile.name}</td>
                                        </tr>
                                        <tr className="hover:bg-gray-50 transition-colors">
                                            <td className="py-5 px-6 text-gray-500 border-r border-b border-gray-200 text-center">2</td>
                                            <td className="py-5 px-6 font-bold text-gray-800 border-r border-b border-gray-200">No. Pendaftaran</td>
                                            <td className="py-5 px-6 text-gray-400 italic border-b border-gray-200">Tiada maklumat</td>
                                        </tr>
                                        <tr className="hover:bg-gray-50 transition-colors">
                                            <td className="py-5 px-6 text-gray-500 border-r border-b border-gray-200 text-center">3</td>
                                            <td className="py-5 px-6 font-bold text-gray-800 border-r border-b border-gray-200">Tarikh Masuk Sekolah</td>
                                            <td className="py-5 px-6 text-gray-400 italic border-b border-gray-200">Tiada maklumat</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // HALAMAN UTAMA (DASHBOARD)
            // ==========================================
            return (
                <div className="min-h-screen relative" style={{ backgroundImage: "url('sekolah.png')", backgroundSize: 'cover', backgroundAttachment: 'fixed', backgroundColor: 'rgba(243, 244, 246, 0.95)', backgroundBlendMode: 'overlay' }}>
                    <nav className="bg-[#2a459b] shadow-md relative z-10 p-4">
                        <div className="max-w-7xl mx-auto flex justify-between items-center text-white">
                            <h1 className="text-xl font-bold uppercase">Fail Peribadi Murid</h1>
                            <button onClick={() => setIsAuthenticated(false)} className="hover:text-gray-200"><i className="fas fa-sign-out-alt mr-2"></i> Log Keluar</button>
                        </div>
                    </nav>

                    <div className="max-w-7xl mx-auto px-4 mt-6 pb-20 relative z-10">
                        {/* Bar Carian & Butang */}
                        <div className="flex flex-col md:flex-row gap-4 mb-6">
                            <div className="flex-grow relative">
                                <i className="fas fa-search absolute left-4 top-4 text-gray-400"></i>
                                <input type="text" placeholder="Cari nama atau kelas..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-11 pr-5 py-3 rounded-lg border-none shadow-sm focus:ring-2 focus:ring-blue-500" />
                            </div>
                            <button onClick={() => setShowAddModal(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-bold shadow-sm">
                                <i className="fas fa-user-plus mr-2"></i> Tambah Murid
                            </button>
                        </div>

                        {/* Jadual */}
                        <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                            <table className="w-full text-left border-collapse">
                                <thead className="bg-gray-50 border-b">
                                    <tr>
                                        <th className="py-4 px-6 font-bold text-gray-600">Nama Murid</th>
                                        <th className="py-4 px-6 font-bold text-gray-600 w-48">Kelas</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredStudents.map((student, index) => (
                                        <tr key={index} onClick={() => setSelectedStudent(student)} className="border-b hover:bg-blue-50 cursor-pointer">
                                            <td className="py-4 px-6 font-bold text-gray-800 uppercase">{student.name}</td>
                                            <td className="py-4 px-6 text-gray-500 uppercase">{student.kelas}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* MODAL PROFIL (KECIL) */}
                    {selectedStudent && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col">
                                <div className="bg-[#2563eb] p-5 flex justify-between items-center text-white">
                                    <h3 className="font-bold text-lg"><i className="fas fa-user-graduate mr-2"></i> Profil Murid</h3>
                                    <button onClick={() => setSelectedStudent(null)} className="hover:text-blue-200"><i className="fas fa-times text-xl"></i></button>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-500">Nama Penuh</label>
                                        <div className="text-xl font-extrabold text-gray-800 uppercase">{selectedStudent.name}</div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-500">Kelas</label>
                                            <div className="text-lg font-bold text-gray-700 uppercase">{selectedStudent.kelas}</div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-500">Status Rekod</label>
                                            <div className="text-lg font-bold text-[#16a34a] flex items-center"><i className="fas fa-check-circle mr-2"></i> Aktif</div>
                                        </div>
                                    </div>
                                    <div className="pt-5 border-t flex justify-end">
                                        <button onClick={() => handleBukaFail(selectedStudent)} className="bg-[#dbeafe] text-[#2563eb] px-5 py-2.5 rounded-xl font-bold hover:bg-[#bfdbfe]">
                                            <i className="fas fa-folder-open mr-2"></i> Buka Fail Peribadi
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL TAMBAH MURID */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                                <div className="bg-[#2563eb] p-5 flex justify-between items-center text-white">
                                    <h3 className="font-bold text-lg">Tambah Murid</h3>
                                    <button onClick={() => setShowAddModal(false)}><i className="fas fa-times text-xl"></i></button>
                                </div>
                                <form onSubmit={submitNewStudent} className="p-6 space-y-4">
                                    <input type="text" required value={newStudent.name} onChange={(e) => setNewStudent({...newStudent, name: e.target.value})} className="w-full px-4 py-2 border rounded-xl" placeholder="Nama Penuh" />
                                    <input type="text" required value={newStudent.kelas} onChange={(e) => setNewStudent({...newStudent, kelas: e.target.value})} className="w-full px-4 py-2 border rounded-xl" placeholder="Kelas" />
                                    <div className="flex gap-4 pt-4">
                                        <button type="button" onClick={() => setShowAddModal(false)} className="w-1/2 py-3 bg-gray-100 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="w-1/2 py-3 bg-blue-600 text-white rounded-xl font-bold">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
