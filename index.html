<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fail Peribadi Murid - SK PK Miri</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Untuk compile JSX dalam browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Modul Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3GRV6VIpECWq48M2jWq_QEQ9RUEbHBBw",
            authDomain: "fail-peribadi-murid.firebaseapp.com",
            projectId: "fail-peribadi-murid",
            storageBucket: "fail-peribadi-murid.firebasestorage.app",
            messagingSenderId: "804840511723",
            appId: "1:804840511723:web:1cbc82e294c55cea21c6ae",
            measurementId: "G-ZRKX0NXHZJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.signInAnonymously = signInAnonymously;
        window.onAuthStateChanged = onAuthStateChanged;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
    </script>

    <!-- Skrip Aplikasi React -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [icNumber, setIcNumber] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(true);

            // Senarai IC kekal
            const [authorizedIcs, setAuthorizedIcs] = useState([
                '810808135501', 
                '910110136471', 
                '880927135284', 
                '920422135813', 
                '970226135344',
                'admin123'
            ]);

            useEffect(() => {
                // Tarik IC dari CSV Google Sheets
                const fetchCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT-vlBOQG_pelA8C9Nfb51agzdS_JyCBV0VJCfFWy-dZV7dvZp1AwQgkGGuSLxoViVHvzmjH0SfBbLD/pub?output=csv";
                
                fetch(fetchCsvUrl)
                    .then(response => response.text())
                    .then(csvText => {
                        const textTanpaSengkang = csvText.replace(/-/g, '');
                        const icDariCsv = textTanpaSengkang.match(/\b\d{12}\b/g) || [];
                        setAuthorizedIcs(prevIcs => {
                            const gabungan = [...prevIcs, ...icDariCsv];
                            return [...new Set(gabungan)];
                        });
                    })
                    .catch(err => console.error("Ralat memuat turun senarai IC:", err));

                const checkFirebase = setInterval(() => {
                    if (window.firebaseAuth) {
                        clearInterval(checkFirebase);
                        window.signInAnonymously(window.firebaseAuth)
                            .then(() => {
                                window.onAuthStateChanged(window.firebaseAuth, (user) => {
                                    if (user) setLoading(false);
                                });
                            })
                            .catch((error) => {
                                console.error("Ralat Firebase:", error);
                                setLoading(false);
                            });
                    }
                }, 100);

                return () => clearInterval(checkFirebase);
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                const cleanInput = icNumber.replace(/-/g, '');

                if (authorizedIcs.includes(cleanInput)) {
                    setIsAuthenticated(true);
                    setError('');
                } else {
                    setError('Nombor Kad Pengenalan tidak sah atau tiada dalam rekod.');
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100">
                        <div className="text-xl font-semibold text-gray-600">Memuatkan Sistem...</div>
                    </div>
                );
            }

            // --- SKRIN LOG MASUK ---
            if (!isAuthenticated) {
                return (
                    <div 
                        className="min-h-screen flex items-center justify-center px-4" 
                        style={{ 
                            backgroundImage: "url('sekolah.png')", 
                            backgroundSize: 'cover', 
                            backgroundPosition: 'center', 
                            backgroundAttachment: 'fixed',
                            backgroundColor: 'rgba(255, 255, 255, 0.7)', 
                            backgroundBlendMode: 'overlay' 
                        }}
                    >
                        <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-100">
                            <div className="text-center mb-8">
                                <div className="flex justify-center mb-4">
                                    <img 
                                        src="logo.png" 
                                        alt="Logo Sekolah" 
                                        className="w-24 h-24 rounded-full object-cover border-4 border-blue-500 shadow-lg bg-gray-50"
                                        onError={(e) => {
                                            e.target.onerror = null; 
                                            e.target.src = "https://via.placeholder.com/150?text=Logo";
                                        }}
                                    />
                                </div>
                                <h1 className="text-2xl font-bold text-gray-800">Fail Peribadi Murid</h1>
                                <p className="text-gray-500 mt-2">Sila log masuk untuk mengakses rekod</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Nombor Kad Pengenalan
                                    </label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i className="fas fa-id-card text-gray-400"></i>
                                        </div>
                                        <input
                                            type="text"
                                            value={icNumber}
                                            onChange={(e) => setIcNumber(e.target.value)}
                                            className="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                            placeholder="Contoh: 010203145678"
                                            required
                                        />
                                    </div>
                                </div>

                                {error && (
                                    <div className="bg-red-50 text-red-500 text-sm p-3 rounded-lg flex items-center">
                                        <i className="fas fa-exclamation-circle mr-2"></i>
                                        {error}
                                    </div>
                                )}

                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors duration-200 shadow-md flex justify-center items-center">
                                    Log Masuk <i className="fas fa-arrow-right ml-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // --- SKRIN UTAMA / DASHBOARD ---
            return (
                <div 
                    className="min-h-screen"
                    style={{ 
                        backgroundImage: "url('sekolah.png')", 
                        backgroundSize: 'cover', 
                        backgroundPosition: 'center', 
                        backgroundAttachment: 'fixed',
                        backgroundColor: 'rgba(243, 244, 246, 0.9)', 
                        backgroundBlendMode: 'overlay'
                    }}
                >
                    {/* Header Banner Biru Gelap */}
                    <nav className="bg-[#2a459b] shadow-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-xl md:text-2xl font-bold text-white tracking-wide uppercase">Fail Peribadi Murid</h1>
                                    <p className="text-blue-100 text-sm mt-1 uppercase">SK Pendidikan Khas Miri</p>
                                </div>
                                <button 
                                    onClick={() => {
                                        setIsAuthenticated(false);
                                        setIcNumber('');
                                    }}
                                    className="text-white hover:text-blue-200 font-medium px-4 py-2 transition-colors flex items-center"
                                >
                                    <i className="fas fa-sign-out-alt mr-2"></i> Log Keluar
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* Kandungan Utama */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
                        
                        {/* Seksyen Makluman */}
                        <div className="bg-[#f0f4ff] rounded-xl border border-blue-200 p-5 mb-6 shadow-sm">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center space-x-4">
                                    <div className="bg-[#dfe6ff] text-blue-700 rounded-lg w-12 h-12 flex items-center justify-center text-xl shadow-sm">
                                        <i className="fas fa-bullhorn"></i>
                                    </div>
                                    <h2 className="text-[#1a3673] font-bold text-lg">PAPAN MAKLUMAN / TINDAKAN</h2>
                                </div>
                                <button className="bg-[#dfe6ff] text-blue-700 hover:bg-blue-200 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center">
                                    <i className="fas fa-edit mr-2"></i> Kemaskini
                                </button>
                            </div>
                            
                            <div className="bg-white rounded-lg p-5 border border-blue-50">
                                <h3 className="font-bold text-[#1a3673] flex items-center mb-2">
                                    <span className="text-pink-600 mr-2"><i className="fas fa-bullhorn"></i></span> 
                                    MAKLUMAN GURU DATA:
                                </h3>
                                <p className="text-[#1a3673] font-medium leading-relaxed mb-4">
                                    Sila pastikan semua maklumat dan rekod fail peribadi murid dikemaskini ke dalam sistem selewat-lewatnya pada hujung bulan ini.
                                </p>
                                <p className="text-[#1a3673] font-medium">
                                    Sila rujuk Guru Data sekiranya terdapat sebarang masalah. Terima kasih.
                                </p>
                            </div>
                        </div>

                        {/* Bar Carian & Butang Tindakan */}
                        <div className="flex flex-col md:flex-row gap-4 mb-6">
                            <div className="flex-grow">
                                <input 
                                    type="text" 
                                    placeholder="Cari nama murid atau kelas..." 
                                    className="w-full h-12 px-5 rounded-lg border-none shadow-sm focus:ring-2 focus:ring-blue-500 text-gray-700"
                                />
                            </div>
                            <div className="flex gap-3">
                                <button className="bg-[#2563eb] hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-medium shadow-sm transition-colors flex items-center">
                                    <i className="fas fa-user-plus mr-2"></i> Tambah Murid
                                </button>
                                <button className="bg-[#16a34a] hover:bg-green-700 text-white px-5 py-3 rounded-lg font-medium shadow-sm transition-colors flex items-center">
                                    <i className="fas fa-download mr-2"></i> Muat Turun
                                </button>
                                <button className="bg-[#374151] hover:bg-gray-800 text-white px-5 py-3 rounded-lg font-medium shadow-sm transition-colors flex items-center">
                                    <i className="fas fa-archive mr-2"></i> Arkib
                                </button>
                            </div>
                        </div>

                        {/* Jadual Nama Murid */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-10">
                            <table className="w-full text-left border-collapse">
                                <thead className="bg-white border-b border-gray-100">
                                    <tr>
                                        <th className="py-4 px-6 font-semibold text-gray-600 text-sm">Nama Murid</th>
                                        <th className="py-4 px-6 font-semibold text-gray-600 text-sm w-48">Kelas</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr className="border-b border-gray-50 hover:bg-gray-50">
                                        <td className="py-4 px-6 font-bold text-gray-800">FAVIAN CARLOS MELCOM</td>
                                        <td className="py-4 px-6 text-gray-500">1BD</td>
                                    </tr>
                                    <tr className="hover:bg-gray-50">
                                        <td className="py-4 px-6 font-bold text-gray-800">HANNA LUMI RAJA BINTI ABDULLAH</td>
                                        <td className="py-4 px-6 text-gray-500">1BD</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
