<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fail Peribadi Murid - SK Pendidikan Khas Miri</title>
  <style>
    /* Reset & Gaya Asas */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                  url('sekolah.png') center/cover no-repeat fixed;
      padding: 20px;
    }

    /* Kad Utama (Paparan Log Masuk) */
    #loginView {
      background-color: #f4f5f8;
      width: 100%;
      max-width: 440px;
      padding: 40px 32px 32px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      text-align: center;
      margin: 20px auto;
    }

    /* Kad Lebar (Paparan Senarai Murid) */
    #dashboardView {
      display: none;
      background-color: #f8f9fa;
      width: 100%;
      max-width: 900px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      margin: 20px auto;
    }

    /* Logo Bulat */
    .logo-wrapper {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: 2px solid #ffffff;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Tajuk Log Masuk */
    .title {
      color: #111827;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .subtitle {
      color: #2563eb;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    /* Borang Input */
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      background-color: #ffffff;
      color: #1f2937;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Butang Log Masuk */
    .btn-login {
      width: 100%;
      background-color: #1e3a8a; /* Biru Gelap Mengikut Asal */
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-bottom: 24px;
    }

    .btn-login:hover {
      background-color: #172554;
    }
    
    .btn-login:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    /* Butang Log Keluar (Merah) */
    .btn-logout {
      background-color: #dc2626;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-logout:hover {
      background-color: #b91c1c;
    }

    /* Nota Kaki */
    .disclaimer {
      color: #6b7280;
      font-size: 11px;
      line-height: 1.5;
      padding: 0 10px;
    }

    /* Header Dashboard */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 25px;
    }

    .dash-title {
      color: #111827;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .guru-id {
      color: #4b5563;
      font-size: 14px;
    }

    /* Carian */
    .search-container {
      margin-bottom: 20px;
    }

    .search-container input {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    /* Jadual Murid */
    .table-container {
      background-color: #ffffff;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      overflow-x: auto;
      max-height: 500px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    th {
      background-color: #f9fafb;
      color: #111827;
      padding: 14px 16px;
      font-weight: 700;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #f3f4f6;
      color: #1f2937;
    }

    tr:hover {
      background-color: #f9fafb;
    }

    /* Lencana Status Lengkap */
    .badge-lengkap {
      display: inline-block;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      background-color: #dcfce7;
      color: #166534;
    }

    .footer-text {
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- ================= PAPARAN 1: LOG MASUK ================= -->
  <div id="loginView">
    <div class="logo-wrapper">
      <img src="logo.png" alt="Logo Sekolah" class="logo-img">
    </div>

    <h1 class="title">FAIL PERIBADI MURID</h1>
    <h2 class="subtitle">SK PENDIDIKAN KHAS MIRI</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="ic_number">No. Kad Pengenalan Guru</label>
        <input 
          type="text" 
          id="ic_number" 
          placeholder="Contoh: 970226135344" 
          required 
          autocomplete="off"
        >
      </div>

      <button type="submit" class="btn-login" id="loginBtn">Log Masuk</button>
    </form>

    <p class="disclaimer">
      Sistem maklumat sulit. Akses terhad kepada guru yang dibenarkan sahaja.
    </p>
  </div>


  <!-- ================= PAPARAN 2: SENARAI MURID ================= -->
  <div id="dashboardView">
    
    <div class="dashboard-header">
      <div>
        <h1 class="dash-title">SENARAI FAIL PERIBADI MURID</h1>
        <p class="guru-id" id="guruLog">Guru ID: -</p>
      </div>
      <button class="btn-logout" onclick="logout()">Log Keluar</button>
    </div>

    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Cari nama murid atau No. MyKid..." onkeyup="filterTable()">
    </div>

    <div class="table-container">
      <table id="studentTable">
        <thead>
          <!-- Header akan dijana automatik dari Google Sheets -->
        </thead>
        <tbody>
          <tr>
            <td colspan="5" style="text-align:center; padding: 30px;">Memuat turun data murid...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer-text">
      SK Pendidikan Khas Miri &copy; Hak Cipta Terpelihara
    </div>

  </div>

  <!-- ================= SKRIP FUNGSI (DATABASE) ================= -->
  <script>
    // Pautan CSV Google Sheets 
    const URL_GURU = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-vlBOQG_pelA8C9Nfb51agzdS_JyCBV0VJCfFWy-dZV7dvZp1AwQgkGGuSLxoViVHvzmjH0SfBbLD/pub?output=csv';
    const URL_MURID = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTy_hVJvUzEnM_cIVpVTn0-2qNk44eGDDHYHggwx1L1m0OwYKS1MsdIqAg_P1UJ6UevBf8EVVJCCiMY/pub?output=csv';

    // FUNGSI 1: Pengesahan Log Masuk Guru
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const icInput = document.getElementById('ic_number').value.trim();
      const loginBtn = document.getElementById('loginBtn');
      
      loginBtn.disabled = true;
      loginBtn.textContent = 'Menyemak Pangkalan Data...';

      try {
        const response = await fetch(URL_GURU);
        const csvData = await response.text();
        const rows = parseCSV(csvData);
        
        let isValid = false;
        // Semak IC dalam Google Sheets
        for(let i = 0; i < rows.length; i++) {
          if(rows[i].some(cell => cell.trim() === icInput)) {
            isValid = true;
            break;
          }
        }

        if(isValid) {
          // Berjaya Log Masuk
          document.getElementById('loginView').style.display = 'none';
          document.getElementById('dashboardView').style.display = 'block';
          document.getElementById('guruLog').textContent = "Guru ID: " + icInput;
          
          // Muat Turun Data Murid
          fetchSenaraiMurid(); 
        } else {
          alert('RALAT: No. Kad Pengenalan tidak wujud di dalam sistem pangkalan data.');
        }
      } catch (error) {
        alert('Gagal menyambung ke pangkalan data Google Sheets. Sila semak sambungan internet anda.');
      }

      loginBtn.disabled = false;
      loginBtn.textContent = 'Log Masuk';
    });


    // FUNGSI 2: Tarik & Susun Senarai Murid
    async function fetchSenaraiMurid() {
      const tableThead = document.querySelector('#studentTable thead');
      const tableTbody = document.querySelector('#studentTable tbody');

      try {
        const response = await fetch(URL_MURID);
        const csvData = await response.text();
        const rows = parseCSV(csvData);

        if(rows.length === 0) return;

        // 1. Bina Header (Baris Pertama CSV)
        const headers = rows[0];
        let theadHTML = '<tr>';
        headers.forEach(h => {
           theadHTML += `<th>${h}</th>`;
        });
        theadHTML += '</tr>';
        tableThead.innerHTML = theadHTML;

        // 2. Bina Data Row (Baris Seterusnya)
        let tbodyHTML = '';
        for(let i = 1; i < rows.length; i++) {
          if(rows[i].length > 1 || rows[i][0] !== "") {
            tbodyHTML += '<tr>';
            
            rows[i].forEach(col => {
              // Jika data tertulis "Lengkap", tukar menjadi lencana hijau (badge)
              if (col.trim().toLowerCase() === 'lengkap') {
                tbodyHTML += `<td><span class="badge-lengkap">Lengkap</span></td>`;
              } else {
                tbodyHTML += `<td>${col}</td>`;
              }
            });
            
            tbodyHTML += '</tr>';
          }
        }
        tableTbody.innerHTML = tbodyHTML;

      } catch (error) {
        tableTbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal memuat turun senarai murid. Sila muat semula halaman.</td></tr>';
      }
    }


    // FUNGSI 3: Enjin Carian Jadual
    function filterTable() {
      const input = document.getElementById("searchInput");
      const filter = input.value.toUpperCase();
      const table = document.getElementById("studentTable");
      const tr = table.getElementsByTagName("tr");

      for (let i = 1; i < tr.length; i++) {
        let isMatch = false;
        const td = tr[i].getElementsByTagName("td");
        for (let j = 0; j < td.length; j++) {
          if (td[j]) {
            const txtValue = td[j].textContent || td[j].innerText;
            if (txtValue.toUpperCase().indexOf(filter) > -1) {
              isMatch = true;
              break;
            }
          }
        }
        tr[i].style.display = isMatch ? "" : "none";
      }
    }


    // FUNGSI 4: Log Keluar Kembali Ke Paparan Asal
    function logout() {
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('ic_number').value = '';
      document.getElementById("searchInput").value = '';
    }


    // FUNGSI 5: Pembaca CSV (Parser)
    function parseCSV(str) {
      const arr = [];
      let quote = false;
      let col = 0, row = 0;
      for (let c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }
  </script>

</body>
</html>
