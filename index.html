<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fail Peribadi Murid - SK Pendidikan Khas Miri</title>
  <style>
    /* Reset & Gaya Asas */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), 
                  url('sekolah.png') center/cover no-repeat fixed;
      padding: 20px;
    }

    /* Kad Utama */
    .container {
      background-color: #f4f5f8;
      width: 100%;
      max-width: 900px;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      text-align: center;
      position: relative;
    }

    /* Logo Bulat */
    .logo-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 15px auto;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: 2px solid #ffffff;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Tajuk */
    .title {
      color: #111827;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .subtitle {
      color: #2563eb;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* Form Log Masuk */
    .login-box {
      max-width: 400px;
      margin: 0 auto;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      background-color: #ffffff;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Butang */
    .btn {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .btn:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .btn-logout {
      background-color: #dc2626;
      width: auto;
      padding: 8px 18px;
      font-size: 13px;
    }

    .btn-logout:hover {
      background-color: #b91c1c;
    }

    /* Bahagian Dashboard */
    #dashboardSection {
      display: none;
      text-align: left;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e5e7eb;
    }

    .user-info {
      font-size: 14px;
      color: #374151;
      font-weight: 600;
    }

    /* Carian Murid */
    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    /* Jadual Murid */
    .table-responsive {
      overflow-x: auto;
      background-color: #ffffff;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      max-height: 500px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th {
      background-color: #f3f4f6;
      color: #374151;
      padding: 12px;
      font-weight: 700;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #f3f4f6;
      color: #1f2937;
    }

    tr:hover {
      background-color: #f9fafb;
    }

    .disclaimer {
      color: #6b7280;
      font-size: 11.5px;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- PAPARAN 1: LOG MASUK -->
    <div id="loginSection">
      <div class="logo-wrapper">
        <img src="logo.png" alt="Logo Sekolah" class="logo-img">
      </div>

      <h1 class="title">MODUL GURU</h1>
      <h2 class="subtitle">SK PENDIDIKAN KHAS MIRI</h2>

      <div class="login-box">
        <form id="loginForm">
          <div class="form-group">
            <label for="ic_number">No. Kad Pengenalan Guru</label>
            <input 
              type="text" 
              id="ic_number" 
              placeholder="Contoh: 810808135501" 
              required 
              autocomplete="off"
            >
          </div>
          <button type="submit" class="btn" id="loginBtn">Log Masuk</button>
        </form>
        <p class="disclaimer">
          Sistem maklumat sulit. Akses terhad kepada guru yang dibenarkan sahaja.
        </p>
      </div>
    </div>

    <!-- PAPARAN 2: SENARAI MURID (DASHBOARD) -->
    <div id="dashboardSection">
      
      <div class="dashboard-header">
        <div>
          <h1 class="title" style="text-align: left; font-size: 18px;">SENARAI FAIL PERIBADI MURID</h1>
          <div class="user-info" id="guruLog">Guru ID: </div>
        </div>
        <button class="btn btn-logout" onclick="logout()">Log Keluar</button>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari nama murid atau No. MyKid / OKU..." onkeyup="filterTable()">
      </div>

      <div class="table-responsive">
        <table id="studentTable">
          <thead>
            <!-- Header dijana automatik -->
          </thead>
          <tbody>
            <tr><td colspan="5" style="text-align:center;">Memuat turun data murid...</td></tr>
          </tbody>
        </table>
      </div>
      
      <p class="disclaimer">SK Pendidikan Khas Miri © Hak Cipta Terpelihara</p>
    </div>

  </div>

  <script>
    // Penukaran pautan pubhtml ke output=csv membolehkan JavaScript membacanya terus.
    const URL_GURU = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-vlBOQG_pelA8C9Nfb51agzdS_JyCBV0VJCfFWy-dZV7dvZp1AwQgkGGuSLxoViVHvzmjH0SfBbLD/pub?output=csv';
    
    const URL_MURID = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTy_hVJvUzEnM_cIVpVTn0-2qNk44eGDDHYHggwx1L1m0OwYKS1MsdIqAg_P1UJ6UevBf8EVVJCCiMY/pub?output=csv';

    // FUNGSI 1: Log Masuk
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const icInput = document.getElementById('ic_number').value.trim();
      const loginBtn = document.getElementById('loginBtn');
      
      loginBtn.disabled = true;
      loginBtn.textContent = 'Menyemak Data...';

      try {
        const response = await fetch(URL_GURU);
        const csvData = await response.text();
        const rows = parseCSV(csvData);
        
        let isValid = false;
        // Menyemak setiap baris untuk padanan No. KP
        for(let i = 0; i < rows.length; i++) {
          // Cari jika sebarang kolum dalam baris tersebut mempunyai No KP
          if(rows[i].some(cell => cell.trim() === icInput)) {
            isValid = true;
            break;
          }
        }

        if(isValid) {
          document.getElementById('loginSection').style.display = 'none';
          document.getElementById('dashboardSection').style.display = 'block';
          document.getElementById('guruLog').textContent = "Guru ID: " + icInput;
          fetchSenaraiMurid(); // Muat turun senarai murid jika log masuk berjaya
        } else {
          alert('Log Masuk Gagal: No. Kad Pengenalan tidak wujud di dalam sistem pangkalan data guru.');
        }
      } catch (error) {
        alert('Ralat menyambung ke pangkalan data Google Sheets.');
      }

      loginBtn.disabled = false;
      loginBtn.textContent = 'Log Masuk';
    });

    // FUNGSI 2: Tarik Data Murid
    async function fetchSenaraiMurid() {
      const tableThead = document.querySelector('#studentTable thead');
      const tableTbody = document.querySelector('#studentTable tbody');

      try {
        const response = await fetch(URL_MURID);
        const csvData = await response.text();
        const rows = parseCSV(csvData);

        if(rows.length === 0) return;

        // Jana Header Jadual
        const headers = rows[0];
        let theadHTML = '<tr>';
        headers.forEach(h => {
           theadHTML += `<th>${h}</th>`;
        });
        theadHTML += '</tr>';
        tableThead.innerHTML = theadHTML;

        // Jana Data Murid
        let tbodyHTML = '';
        for(let i = 1; i < rows.length; i++) {
          if(rows[i].length > 1 || rows[i][0] !== "") {
            tbodyHTML += '<tr>';
            rows[i].forEach(col => {
              tbodyHTML += `<td>${col}</td>`;
            });
            tbodyHTML += '</tr>';
          }
        }
        tableTbody.innerHTML = tbodyHTML;

      } catch (error) {
        tableTbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal memuat turun data murid. Sila muat semula.</td></tr>';
      }
    }

    // FUNGSI 3: Carian Murid
    function filterTable() {
      const input = document.getElementById("searchInput");
      const filter = input.value.toUpperCase();
      const table = document.getElementById("studentTable");
      const tr = table.getElementsByTagName("tr");

      for (let i = 1; i < tr.length; i++) {
        let isMatch = false;
        const td = tr[i].getElementsByTagName("td");
        for (let j = 0; j < td.length; j++) {
          if (td[j]) {
            const txtValue = td[j].textContent || td[j].innerText;
            if (txtValue.toUpperCase().indexOf(filter) > -1) {
              isMatch = true;
              break;
            }
          }
        }
        tr[i].style.display = isMatch ? "" : "none";
      }
    }

    // FUNGSI 4: Log Keluar
    function logout() {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('ic_number').value = '';
      document.getElementById("searchInput").value = '';
    }

    // FUNGSI 5: Pembaca Format CSV
    function parseCSV(str) {
      const arr = [];
      let quote = false;
      let col = 0, row = 0;
      for (let c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }
  </script>
</body>
</html>
